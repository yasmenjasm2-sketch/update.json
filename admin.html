<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الفاخرة | منصة ريماس لإدارة الأجهزة</title>
    <style>
        :root {
            --bg-color: #0E051A;       
            --card-bg: #1A0B2E;        
            --primary: #BB86FC;        
            --primary-dark: #9368E6;   
            --text-main: #FFFFFF;      
            --text-muted: #E0AAFF;     
            --input-bg: #25143E;       
            --border-color: #4A306D;
            --danger: #FF4A4A;
            --success: #25D366;
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px 15px;
            direction: rtl;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--input-bg);
            color: #FFFFFF;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn-activate {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        button.btn-ban {
            background: rgba(255, 74, 74, 0.15);
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }

        button:active {
            transform: scale(0.98);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }

        th {
            background: rgba(187, 134, 252, 0.1);
            color: var(--primary);
            padding: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: #FFFFFF;
            font-family: monospace;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }

        .badge-active { background: rgba(37, 211, 102, 0.2); color: var(--success); }
        .badge-banned { background: rgba(255, 74, 74, 0.2); color: var(--danger); }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
        
        .notification {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
            text-align: center;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>لوحة تحكم منصة نبراس وريماس</h1>
        <p>إدارة تفعيل وحظر الاشتراكات الفورية عبر الـ Device ID</p>
    </header>

    <div id="toast" class="notification"></div>

    <div class="card">
        <h2>➕ التحكم ومعالجة معرف جهاز</h2>
        
        <div class="form-group">
            <label for="deviceIdInput">معرف بصمة الجهاز (Device ID)</label>
            <input type="text" id="deviceIdInput" placeholder="أدخل أو الصق الـ ID أو كود الاشتراك هنا..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="durationSelect">مدة الصلاحية (في حال التفعيل البدوي)</label>
            <select id="durationSelect">
                <option value="20seconds">20 ثانية (20 Seconds)</option>
                <option value="1hour">ساعة واحدة (1 Hour)</option>
                <option value="1day">يوم واحد (1 Day)</option>
                <option value="2day">يومان (2 Days)</option>
                <option value="30days" selected>شهر كامل (30 Days)</option>
                <option value="lifetime">مدى الحياة (Lifetime)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-activate" onclick="saveDevice(1)">تفعيل / تجديد الاشتراك ✅</button>
            <button class="btn-ban" onclick="saveDevice(2)">حظر هذا الجهاز فوراً ⛔</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 قائمة الأجهزة المحفوظة حالياً في الفايربيس</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Device ID</th>
                        <th>الحالة</th>
                        <th>تاريخ الانتهاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="devicesTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">جاري الاتصال السحابي بالبيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // قائمة أكواد الاشتراكات المحددة من قبلك
    const subscriptionCodes = {
        "opssyria": { duration: "30days", status: 2 },
        "MONTH-HACK": { duration: "30days", status: 2 },
        "SUB-MONTH": { duration: "30days", status: 2 },
        "hamzaxxx123": { duration: "2day", status: 2 },
        "hamzahamza": { duration: "1day", status: 2 },
        "SU7B-HOUR": { duration: "1hour", status: 2 },
        "TEST-20SEC": { duration: "20seconds", status: 2 },
        "VIP-FUTURE": { duration: "lifetime", status: 2 }
    };

    // تهيئة البيانات السحابية
    const firebaseConfig = {
        apiKey: "AIzaSyApqVwnKmq0gJ7k-UM-jLNxaYlBPkRx1Go",
        authDomain: "chatlive-4387e.firebaseapp.com",
        databaseURL: "https://chatlive-4387e-default-rtdb.firebaseio.com",
        projectId: "chatlive-4387e",
        storageBucket: "chatlive-4387e.firebasestorage.app",
        messagingSenderId: "722728428486",
        appId: "1:722728428486:android:847b11a7743dfb7d5ac8c7"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // دالة لربط ومزامنة أكواد الاشتراكات الجاهزة تلقائياً في الفايربيس
    function syncSubscriptionCodes() {
        database.ref('subscriptionCodes').set(subscriptionCodes)
        .then(() => {
            console.log("تم تحديث ومزامنة قواعد أكواد الاشتراكات بنجاح.");
        }).catch((err) => {
            console.error("فشل في مزامنة الأكواد: ", err);
        });
    }
    syncSubscriptionCodes();

    // تم إصلاح الخطأ البرمجي هنا بوضع قيم المتغيرات داخل علامات اقتباس نصية لإصلاح الانهيار
    function showToast(msg, isSuccess) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        toast.style.background = isSuccess ? 'rgba(37, 211, 102, 0.2)' : 'rgba(255, 74, 74, 0.2)';
        toast.style.color = isSuccess ? 'var(--success)' : 'var(--danger)'; 
        setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    // تحديث الحسابات الزمنية لتتوافق مع المدخلات الجديدة (ثواني، يومين، إلخ)
    function getExpiryTimestamp(durationStr) {
        let ms = 0;
        if (durationStr === "20seconds") ms = 20 * 1000;
        else if (durationStr === "1hour") ms = 1 * 60 * 60 * 1000;
        else if (durationStr === "1day") ms = 24 * 60 * 60 * 1000;
        else if (durationStr === "2day") ms = 2 * 24 * 60 * 60 * 1000;
        else if (durationStr === "30days") ms = 30 * 24 * 60 * 60 * 1000;
        else if (durationStr === "lifetime") ms = 100 * 365 * 24 * 60 * 60 * 1000;
        return Date.now() + ms;
    }

    // إضافة أو حظر جهاز
    function saveDevice(statusCode) {
        const devId = document.getElementById('deviceIdInput').value.trim();
        let duration = document.getElementById('durationSelect').value;
        let finalStatus = statusCode;
        let codeLabel = statusCode === 1 ? "WEB-DB-ACTIVE" : "BANNED";

        if(!devId) {
            alert('الرجاء كتابة معرف الـ ID أولاً بشكل صحيح.');
            return;
        }

        // إذا قام المشرف بإدخال كود من الأكواد الجاهزة، يتم تهيئة البيانات المحددة له تلقائياً
        if (subscriptionCodes[devId]) {
            duration = subscriptionCodes[devId].duration;
            finalStatus = subscriptionCodes[devId].status;
            codeLabel = "CODE-PROMO-ACTIVATED";
        }

        const finalExpiry = getExpiryTimestamp(duration);
        const isoString = new Date(finalExpiry).toISOString();

        database.ref('devices/' + devId).set({
            status: finalStatus,
            expireAt: isoString,
            expiryTime: finalExpiry,
            code: codeLabel
        }).then(() => {
            showToast(finalStatus === 1 ? "تم تفعيل واضافة جهازك السحابي بنجاح!" : "تم معالجة حالة الجهاز بنجاح داخل النظام 🛡️", true);
            document.getElementById('deviceIdInput').value = "";
        }).catch((err) => {
            showToast("فشلت العملية، تأكد من إعدادات الحماية لقاعدة البيانات.", false);
        });
    }

    // حذف جهاز نهائياً من الداتابيز
    window.deleteDevice = function(id) {
        if(confirm("هل أنت متأكد من رغبتك في حذف هذا الجهاز من السحابة؟")) {
            database.ref('devices/' + id).remove().then(() => {
                showToast("تم إزالة وثيقة الجهاز بنجاح من الخادم.", true);
            });
        }
    }

    // المزامنة الحية وعرض الجدول الفاخر
    database.ref('devices').on('value', (snapshot) => {
        const tbody = document.getElementById('devicesTableBody');
        tbody.innerHTML = "";
        const data = snapshot.val();

        if(!data) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">لا توجد أي أجهزة مسجلة حالياً في السيرفر.</td></tr>`;
            return;
        }

        for (let id in data) {
            const dev = data[id];
            // يدعم التحقق من الحظر إذا كانت الحالة تساوي 2
            const isBanned = dev.status === 2;
            const expiryDate = new Date(dev.expireAt || dev.expiryTime).toLocaleString('ar-EG');
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:var(--primary); font-weight: bold;">${id}</td>
                <td><span class="badge ${isBanned ? 'badge-banned' : 'badge-active'}">${isBanned ? 'محظور / مفعل كود ⛔' : 'نشط مفعّل  ✅'}</span></td>
                <td style="font-size:12px; color: #ccc;">${expiryDate}</td>
                <td><button class="btn-delete" onclick="deleteDevice('${id}')">إلغاء وتصفير</button></td>
            `;
            tbody.appendChild(tr);
        }
    });
</script>

</body>
</html>
