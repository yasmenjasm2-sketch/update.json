<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F051D">
    <title>تجربة مجانية | HAMZA VIP</title>
    <style>
        :root {
            --bg-color: #0F051D;
            --card-bg: rgba(45, 27, 77, 0.85);
            --primary: #FFD700;
            --primary-dark: #F5A623;
            --text-main: #FFFFFF;
            --text-muted: #E0AAFF;
            --border-color: #4A306D;
            --neon-glow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* حظر التحديد واللمس المطول والارتداد لتبدو شاشة تطبيق حقيقية تماماً */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            justify-content: center;
            overscroll-behavior: none; /* منع سحب وإعادة تحميل الشاشة */
            overflow: hidden;
        }

        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 24px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--neon-glow);
            width: 85%;
            max-width: 340px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gift-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }
        .gift-icon svg { width: 45px; height: 45px; fill: #4A2500; }

        h2 { 
            margin: 0 0 8px 0; 
            font-size: 24px; 
            font-weight: 800; 
            background: linear-gradient(to left, #FFFFFF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 30px 0; font-weight: 500; line-height: 1.5; white-space: pre-line; }

        button.main-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 18px; color: #4A2500;
            font-weight: 800; font-size: 16px; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }
        button.main-btn:active { transform: scale(0.97); filter: brightness(1.1); }
        button.main-btn:disabled { filter: grayscale(0.5); opacity: 0.6; cursor: not-allowed; }

        .loading-container { display: none; margin-top: 10px; }
        
        .progress-circle {
            position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto;
        }
        
        .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-circle circle {
            fill: none; stroke-width: 8; stroke-linecap: round;
        }
        .bg-circle { stroke: rgba(255, 215, 0, 0.1); }
        .fg-circle {
            stroke: url(#gradient);
            stroke-dasharray: 339.292;
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        .progress-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 800; color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .back-btn {
            display: inline-block; margin-top: 20px; color: var(--text-muted);
            font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--text-muted);
            cursor: pointer;
        }

        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { from { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4); } to { transform: scale(1.05); box-shadow: 0 15px 35px rgba(255, 215, 0, 0.7); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="gift-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 10V8H17.19C16.74 7.22 16.12 6.55 15.37 6.04C14.07 5.16 12.56 5 12 5C11.44 5 9.93 5.16 8.63 6.04C7.88 6.55 7.26 7.22 6.81 8H4V10H20ZM12 7C12.5 7 13.56 7.15 14.24 7.61C14.71 7.93 15.06 8.41 15.22 9H8.78C8.94 8.41 9.29 7.93 9.76 7.61C10.44 7.15 11.5 7 12 7Z"/>
            <path d="M20 12H13V22H19C19.55 22 20 21.55 20 21V12Z"/>
            <path d="M11 22V12H4V21C4 21.55 4.45 22 5 22H11Z"/>
        </svg>
    </div>
    
    <h2 id="mainTitle">التجربة المجانية</h2>
    <p class="subtitle" id="statusText">جاري فحص حالة الجهاز والاتصال الآمن بقاعدة البيانات...</p>

    <div id="startUI" style="display: none;">
        <button class="main-btn" id="actionBtn" onclick="startFreeTrial()">الدخول إلى التطبيق بشكل مجاني</button>
        <span onclick="goBack()" class="back-btn">العودة لتسجيل الدخول</span>
    </div>

    <div id="loadingUI" class="loading-container">
        <div class="progress-circle">
            <svg viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFD700" />
                        <stop offset="100%" stop-color="#F5A623" />
                    </linearGradient>
                </defs>
                <circle class="bg-circle" cx="60" cy="60" r="54"></circle>
                <circle class="fg-circle" id="progressCircle" cx="60" cy="60" r="54"></circle>
            </svg>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>
</div>

<script>
    let globalDeviceId = "UNKNOWN";
    let isCheckedFromDB = false;

    // دالة مرنة لاستقبال البيانات من التطبيق أو واجهة الجافا الأصلية
    function verifySession(deviceId, appVersion, activeCode, isBackground) {
        if (deviceId && deviceId !== "UNKNOWN") {
            globalDeviceId = deviceId;
            localStorage.setItem("VIP_DEVICE_ID", deviceId);
            
            // بمجرد الحصول على المعرف، نقوم بفحصه فوراً في قاعدة البيانات لمنع التلاعب
            if (!isCheckedFromDB) {
                checkDeviceSubscriptionInDB(deviceId);
            }
        }
    }

    // تعزيز الحماية والأمان فور تشغيل الملف
    window.onload = function() {
        // حظر القوائم المنبثقة واللمس المطول نهائياً لمنع كشف الويب
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        
        // حظر اختصارات لوحة المفاتيح وأدوات الفحص (DevTools)
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
                return false;
            }
        });

        // محاولة جلب الـ ID بشكل مباشر وفوري عبر جسر الأندرويد لسرعة الاستجابة
        try {
            if (window.AndroidBridge && typeof window.AndroidBridge.getDeviceId === 'function') {
                let id = window.AndroidBridge.getDeviceId();
                if (id) verifySession(id, "", "", false);
            }
        } catch(e) {}

        // إذا لم يستجب الجسر فوراً، نتحقق بعد نصف ثانية للتأكد من حالة الفحص
        setTimeout(() => {
            if (globalDeviceId === "UNKNOWN") {
                let savedId = localStorage.getItem("VIP_DEVICE_ID");
                if (savedId) {
                    globalDeviceId = savedId;
                    checkDeviceSubscriptionInDB(savedId);
                } else {
                    // إذا كان أول مرة أو تم مسح البيانات بالكامل ولم يرسل التطبيق معرفاً بعد
                    enableNewTrialUI();
                }
            }
        }, 600);
    }

    // وظيفة فحص الاشتراك داخل قاعدة البيانات للتعرف على الجهاز حتى بعد مسح البيانات
    function checkDeviceSubscriptionInDB(deviceId) {
        isCheckedFromDB = true;
        
        // نقوم بإرسال طلب فحص وهمي ذكي للتطبيق للتحقق من Firebase أو SQLite
        // التطبيق يستقبل الإشارة عبر الـ WebView ويقوم بالرد
        window.location.href = `app://check_trial_status?device_id=${deviceId}`;
        
        /* ملاحظة برمجية: يمكنك ربط هذه الدالة بـ Fetch API إذا كان لديك رابط خادم مباشر، 
           أو الاعتماد على كود الأندرويد في التطبيق للرد على الصفحة عبر دالة (setTrialStatusFromApp) أدناه:
        */
        
        // كحل حماية احتياطي متكامل بالصفحة (FallBack):
        // إذا لم يرد التطبيق في غضون ثانية، نعتبره جهازاً جديداً ونعرض واجهة الـ 10 ثوانٍ
        setTimeout(() => {
            if (document.getElementById('statusText').innerText.includes("جاري فحص")) {
                enableNewTrialUI();
            }
        }, 1200);
    }

    // دالة يستدعيها مطور الأندرويد من الكود الأصلي ليعلم الويب بحالة الجهاز المخزنة في Firebase
    function setTrialStatusFromApp(isRegistered, expiryTime) {
        if (isRegistered && expiryTime) {
            let currentTime = Date.now();
            if (currentTime < expiryTime) {
                // الجهاز مفعل مسبقاً والمدة لا زالت مستمرة (تخطي العداد فوراً لمنع التلاعب بالأيام)
                document.getElementById('startUI').style.display = 'none';
                document.getElementById('loadingUI').style.display = 'block';
                document.getElementById('statusText').innerText = "تم التعرف على جهازك! جاري استئناف التجربة المجانية النشطة...";
                
                // تحديث سريع للعداد ليعطي طابعاً احترافياً
                updateCircleProgress(100);
                
                setTimeout(() => {
                    window.location.href = `app://success_auth?code=FREE_TRIAL_VIP&expiry_time=${expiryTime}&device_id=${globalDeviceId}&save_to_db=false`;
                }, 800);
                return;
            } else {
                // التجربة انتهت بالفعل ولا يمكنه تجديدها حتى لو مسح بيانات التطبيق
                document.getElementById('loadingUI').style.display = 'none';
                document.getElementById('startUI').style.display = 'block';
                document.getElementById('actionBtn').disabled = true;
                document.getElementById('actionBtn').innerText = "انتهت الفترة التجريبية للجهاز";
                document.getElementById('statusText').innerText = "عذراً، لقد استنفذ هذا الجهاز الفترة التجريبية المجانية المتاحة له مسبقاً.";
                return;
            }
        }
        // إذا كان الجهاز غير مسجل نهائياً في قاعدة البيانات
        enableNewTrialUI();
    }

    function enableNewTrialUI() {
        document.getElementById('loadingUI').style.display = 'none';
        document.getElementById('startUI').style.display = 'block';
        document.getElementById('statusText').innerText = "احصل على وصول مجاني ومؤقت لاختبار كافة مميزات التطبيق بكل أمان.";
    }

    function updateCircleProgress(percent) {
        let circle = document.getElementById('progressCircle');
        let text = document.getElementById('progressText');
        let circleLength = 339.292;
        text.innerText = percent + "%";
        let offset = circleLength - (percent / 100) * circleLength;
        circle.style.strokeDashoffset = offset;
    }

    function startFreeTrial() {
        document.getElementById('startUI').style.display = 'none';
        document.getElementById('loadingUI').style.display = 'block';
        document.getElementById('statusText').innerText = "جاري تهيئة البيئة المجانية الخاصة بك...\nالرجاء الانتظار (10 ثوانٍ) وعدم إغلاق التطبيق.";

        let totalTime = 10; // وقت الانتظار 10 ثوانٍ
        let timeLeft = totalTime;
        
        let timerInterval = setInterval(() => {
            timeLeft--;
            
            let percent = Math.floor(((totalTime - timeLeft) / totalTime) * 100);
            updateCircleProgress(percent);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('statusText').innerText = "تم التجهيز بنجاح! جاري حفظ الاشتراك وتوجيهك...";
                
                setTimeout(() => {
                    let expiryMs = 24 * 60 * 60 * 1000; // صلاحية التجربة (يوم واحد مستمر في قاعدة البيانات)
                    let finalExpiry = Date.now() + expiryMs;
                    
                    // هنا نرسل save_to_db=true ليقوم كود الأندرويد بحفظ finalExpiry و device_id في السيرفر أو الفايربيس فوراُ
                    window.location.href = `app://success_auth?code=FREE_TRIAL_VIP&expiry_time=${finalExpiry}&device_id=${globalDeviceId}&save_to_db=true`;
                }, 800);
            }
        }, 1000);
    }

    function goBack() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
