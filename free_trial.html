<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F051D">
    <title>تجربة مجانية | HAMZA VIP</title>
    <style>
        :root {
            --bg-color: #0F051D;
            --card-bg: rgba(45, 27, 77, 0.85);
            --primary: #FFD700;
            --primary-dark: #F5A623;
            --text-main: #FFFFFF;
            --text-muted: #E0AAFF;
            --border-color: #4A306D;
            --neon-glow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            -webkit-user-select: none;
            user-select: none;
            justify-content: center;
        }

        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 24px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--neon-glow);
            width: 85%;
            max-width: 340px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gift-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }
        .gift-icon svg { width: 45px; height: 45px; fill: #4A2500; }

        h2 { 
            margin: 0 0 8px 0; 
            font-size: 24px; 
            font-weight: 800; 
            background: linear-gradient(to left, #FFFFFF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 30px 0; font-weight: 500; line-height: 1.5; }

        button.main-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 18px; color: #4A2500;
            font-weight: 800; font-size: 16px; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }
        button.main-btn:active { transform: scale(0.97); filter: brightness(1.1); }

        /* دائرة التحميل الأنيقة */
        .loading-container { display: none; margin-top: 10px; }
        
        .progress-circle {
            position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto;
        }
        
        .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-circle circle {
            fill: none; stroke-width: 8; stroke-linecap: round;
        }
        .bg-circle { stroke: rgba(255, 215, 0, 0.1); }
        .fg-circle {
            stroke: url(#gradient);
            stroke-dasharray: 339.292; /* 2 * PI * r (r=54) */
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 1s linear;
        }
        
        .progress-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 800; color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .back-btn {
            display: inline-block; margin-top: 20px; color: var(--text-muted);
            font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--text-muted);
        }

        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { from { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4); } to { transform: scale(1.05); box-shadow: 0 15px 35px rgba(255, 215, 0, 0.7); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="gift-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 10V8H17.19C16.74 7.22 16.12 6.55 15.37 6.04C14.07 5.16 12.56 5 12 5C11.44 5 9.93 5.16 8.63 6.04C7.88 6.55 7.26 7.22 6.81 8H4V10H20ZM12 7C12.5 7 13.56 7.15 14.24 7.61C14.71 7.93 15.06 8.41 15.22 9H8.78C8.94 8.41 9.29 7.93 9.76 7.61C10.44 7.15 11.5 7 12 7Z"/>
            <path d="M20 12H13V22H19C19.55 22 20 21.55 20 21V12Z"/>
            <path d="M11 22V12H4V21C4 21.55 4.45 22 5 22H11Z"/>
        </svg>
    </div>
    
    <h2>التجربة المجانية</h2>
    <p class="subtitle" id="statusText">احصل على وصول مجاني ومؤقت لاختبار كافة مميزات التطبيق بكل أمان.</p>

    <div id="startUI">
        <button class="main-btn" onclick="startFreeTrial()">الدخول إلى التطبيق بشكل مجاني</button>
        <a href="index.html" class="back-btn">العودة لتسجيل الدخول</a>
    </div>

    <div id="loadingUI" class="loading-container">
        <div class="progress-circle">
            <svg viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFD700" />
                        <stop offset="100%" stop-color="#F5A623" />
                    </linearGradient>
                </defs>
                <circle class="bg-circle" cx="60" cy="60" r="54"></circle>
                <circle class="fg-circle" id="progressCircle" cx="60" cy="60" r="54"></circle>
            </svg>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>
</div>

<script>
    let globalDeviceId = "UNKNOWN";

    // دالة لاستقبال معرف الجهاز من التطبيق (نفس الموجودة في الملف الأول)
    function verifySession(deviceId, appVersion, activeCode, isBackground) {
        globalDeviceId = deviceId;
        // حفظ المعرف في الجلسة المحلية كإجراء احتياطي إضافي
        if (deviceId && deviceId !== "UNKNOWN") {
            localStorage.setItem("VIP_DEVICE_ID", deviceId);
        }
    }

    // استعادة معرف الجهاز إذا كان محفوظاً من قبل
    window.onload = function() {
        let savedId = localStorage.getItem("VIP_DEVICE_ID");
        if(savedId) globalDeviceId = savedId;
    }

    function startFreeTrial() {
        // إخفاء زر البداية وإظهار التحميل
        document.getElementById('startUI').style.display = 'none';
        document.getElementById('loadingUI').style.display = 'block';
        document.getElementById('statusText').innerText = "جاري تهيئة البيئة المجانية الخاصة بك...\nالرجاء الانتظار (دقيقتان) وعدم إغلاق الشاشة.";

        let totalTime = 120; // 120 ثانية = دقيقتان
        let timeLeft = totalTime;
        let circle = document.getElementById('progressCircle');
        let text = document.getElementById('progressText');
        
        let circleLength = 339.292; // محيط الدائرة

        let timerInterval = setInterval(() => {
            timeLeft--;
            
            // حساب النسبة المئوية وتحديث الدائرة
            let percent = Math.floor(((totalTime - timeLeft) / totalTime) * 100);
            text.innerText = percent + "%";
            
            let offset = circleLength - (percent / 100) * circleLength;
            circle.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('statusText').innerText = "تم التجهيز بنجاح! جاري تحويلك...";
                
                // توجيه المستخدم لداخل التطبيق وإعطائه اشتراك تجريبي (مثلاً يوم واحد)
                // يتم إرسال deviceId و save_to_firebase لتتمكن برمجة الجافا من حفظه في قواعد البيانات
                setTimeout(() => {
                    let expiryMs = 24 * 60 * 60 * 1000; // مدة التجربة (يوم واحد)
                    let finalExpiry = Date.now() + expiryMs;
                    
                    // يتم إرسال parameter جديد (save_to_db=true) ليعلم تطبيق الاندرويد أنه يجب حفظ الـ id في فايربيس
                    window.location.href = `app://success_auth?code=FREE_TRIAL_VIP&expiry_time=${finalExpiry}&device_id=${globalDeviceId}&save_to_db=true`;
                }, 1000);
            }
        }, 1000);
    }
</script>
</body>
</html>
