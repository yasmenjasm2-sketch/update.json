<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F051D">
    <title>نظام التجربة والاشتراك | HAMZA VIP</title>
    <style>
        :root {
            --bg-color: #0F051D;
            --card-bg: rgba(45, 27, 77, 0.85);
            --primary: #FFD700;
            --primary-dark: #F5A623;
            --paid-primary: #9D4EDD;
            --paid-dark: #6A0DAD;
            --text-main: #FFFFFF;
            --text-muted: #E0AAFF;
            --border-color: #4A306D;
            --neon-glow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            -webkit-user-select: none;
            user-select: none;
            justify-content: center;
        }

        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 24px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--neon-glow);
            width: 85%;
            max-width: 340px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gift-icon {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        .gift-icon svg { width: 40px; height: 40px; fill: #4A2500; }

        h2 { 
            margin: 0 0 8px 0; 
            font-size: 22px; 
            font-weight: 800; 
            background: linear-gradient(to left, #FFFFFF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle { font-size: 13px; color: var(--text-muted); margin: 0 0 25px 0; font-weight: 500; line-height: 1.5; }

        button.main-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 16px; color: #4A2500;
            font-weight: 800; font-size: 15px; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        button.main-btn:active { transform: scale(0.97); filter: brightness(1.1); }

        /* ستايل مخصص لزر الاشتراك المدفوع الثاني */
        .paid-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }
        .paid-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        button.paid-btn {
            background: linear-gradient(135deg, var(--paid-primary), var(--paid-dark));
            color: #FFFFFF;
            box-shadow: 0 8px 20px rgba(157, 78, 221, 0.3);
        }

        .loading-container { display: none; margin-top: 10px; }
        
        .progress-circle {
            position: relative; width: 110px; height: 110px; margin: 0 auto 15px auto;
        }
        
        .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-circle circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .bg-circle { stroke: rgba(255, 215, 0, 0.1); }
        .fg-circle {
            stroke: url(#gradient);
            stroke-dasharray: 339.292;
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 1s linear;
        }
        
        .progress-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 22px; font-weight: 800; color: #FFD700;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { from { transform: scale(1); } to { transform: scale(1.04); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="mainContentUI">
        <div class="gift-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 10V8H17.19C16.74 7.22 16.12 6.55 15.37 6.04C14.07 5.16 12.56 5 12 5C11.44 5 9.93 5.16 8.63 6.04C7.88 6.55 7.26 7.22 6.81 8H4V10H20ZM12 7C12.5 7 13.56 7.15 14.24 7.61C14.71 7.93 15.06 8.41 15.22 9H8.78C8.94 8.41 9.29 7.93 9.76 7.61C10.44 7.15 11.5 7 12 7Z"/>
                <path d="M20 12H13V22H19C19.55 22 20 21.55 20 21V12Z"/>
                <path d="M11 22V12H4V21C4 21.55 4.45 22 5 22H11Z"/>
            </svg>
        </div>
        
        <h2>بوابة الوصول الآمن</h2>
        <p class="subtitle" id="statusText">اضغط أدناه لإرسال طلب فحص التفعيل الخاص بجهازك بشكل تلقائي.</p>

        <div id="startUI">
            <button class="main-btn" onclick="requestDeviceActivation()">طلب الانضمام وفحص التفعيل ⚡</button>
            
            <div class="paid-section">
                <div class="paid-title">لديك اشتراك رسمي مدفوع؟</div>
                <button class="main-btn paid-btn" onclick="goToPaidWeb()">الانتقال لصفحة الاشتراك المدفوع 💎</button>
            </div>
        </div>
    </div>

    <div id="loadingUI" class="loading-container">
        <div class="progress-circle">
            <svg viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFD700" />
                        <stop offset="100%" stop-color="#F5A623" />
                    </linearGradient>
                </defs>
                <circle class="bg-circle" cx="60" cy="60" r="54"></circle>
                <circle class="fg-circle" id="progressCircle" cx="60" cy="60" r="54"></circle>
            </svg>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>
</div>

<script>
    let globalDeviceId = "UNKNOWN";

    function verifySession(deviceId, appVersion, activeCode, isBackground) {
        globalDeviceId = deviceId;
        if (deviceId && deviceId !== "UNKNOWN") {
            localStorage.setItem("VIP_DEVICE_ID", deviceId);
        }
    }

    window.onload = function() {
        let savedId = localStorage.getItem("VIP_DEVICE_ID");
        if(savedId) globalDeviceId = savedId;
    }

    function requestDeviceActivation() {
        document.getElementById('startUI').style.display = 'none';
        document.getElementById('loadingUI').style.display = 'block';
        document.getElementById('statusText').innerText = "جاري إرسال معرف جهازك للتليجرام للتفعيل والتحقق من الصلاحية الحالية...";

        let totalTime = 5; // فحص سريع مدته 5 ثوانٍ ليبدو احترافيًا وتلقائيًا
        let timeLeft = totalTime;
        let circle = document.getElementById('progressCircle');
        let text = document.getElementById('progressText');
        let circleLength = 339.292;

        let timerInterval = setInterval(() => {
            timeLeft--;
            let percent = Math.floor(((totalTime - timeLeft) / totalTime) * 100);
            text.innerText = percent + "%";
            circle.style.strokeDashoffset = circleLength - (percent / 100) * circleLength;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                // إرسال أمر لتطبيق أندرويد لإرسال البيانات الفورية لتليجرام وتدقيق الملف الداخلي للجافا
                window.location.href = `app://send_telegram_request?device_id=${globalDeviceId}`;
                
                setTimeout(() => {
                    document.getElementById('loadingUI').style.display = 'none';
                    document.getElementById('startUI').style.display = 'block';
                    document.getElementById('statusText').innerText = "تم إرسال الـ ID بنجاح! إذا قام المطور بتفعيل جهازك مسبقاً، سيفتح التطبيق فوراً تلقائياً.";
                }, 1000);
            }
        }, 1000);
    }

    // دالة فتح رابط الاشتراك المدفوع الثاني
    function goToPaidWeb() {
        window.location.href = "app://open_paid_web";
    }
</script>
</body>
</html>
