<body>

<div class="app-container" id="mainCard">
    <div class="app-icon">🛡️</div>

    <p class="subtitle" id="statusText">أدخل كود الاشتراك الآمن</p>
    
    <div id="authUI">

</div>

<script>
    // --- [ إعدادات السيرفر والإصدار ] ---
    // قم بتغيير هذا الرقم لإجبار المستخدمين على التحديث
    const REQUIRED_APP_VERSION = "2.1.0";
    const UPDATE_LINK = "https://yasmenjasm2-sketch.github.io/update.json";

    // --- [ قائمة الأجهزة الموثوقة (VIP) والمحظورة ] ---
    // status: 1 = مفعل، status: 2 = محظور
    const vipDevices = {
        "b2c8cdd53aba1104": { status: 1, expireAt: "2027-01-01T00:00:00" },
        "BANNED_DEVICE_ID": { status: 2, expireAt: "2025-01-01T00:00:00" } 
    };

    // --- [ قائمة الأكواد ] ---
    const subscriptionCodes = {
        "HAMZA-MONTH": { duration: "30days", status: 1 },
        "HAMZA-DAY":   { duration: "1day", status: 1 },
        "HAMZA-HOUR":  { duration: "1hour", status: 1 },
        "HAMZA-TEST":  { duration: "5minutes", status: 1 },
        "BANNED-CODE": { duration: "30days", status: 2 } // كود محظور
    };

    let globalDeviceId = "UNKNOWN";

    // دالة تحويل الوقت
    function getDurationMs(durationStr) {
        let ms = 0;
        const match = durationStr.match(/(\d+)/);
        const val = match ? parseInt(match[0]) : 0;
        if (durationStr.includes("day")) ms = val * 24 * 60 * 60 * 1000;
        else if (durationStr.includes("hour")) ms = val * 60 * 60 * 1000;
        else if (durationStr.includes("minute")) ms = val * 60 * 1000;
        return ms;
    }

    function showError(msg) {
        const err = document.getElementById('error');
        err.innerText = msg;
        err.style.display = 'block';
    }

    // ==========================================
    // هذه الدالة الأساسية التي يستدعيها الجافا (تحديث، حظر، فحص)
    // ==========================================
    function verifySession(deviceId, appVersion, activeCode, isBackground) {
        globalDeviceId = deviceId;
        
        if (!isBackground) {
            document.getElementById('deviceDisplay').innerText = "DEVICE ID: " + deviceId;
        }

        // 1. فحص التحديث (إجباري)
        if (appVersion !== REQUIRED_APP_VERSION) {
            window.location.href = `app://force_update?link=${encodeURIComponent(UPDATE_LINK)}`;
            return;
        }

        // 2. فحص حظر الجهاز (VIP List)
        const vipData = vipDevices[deviceId];
        if (vipData && vipData.status === 2) {
            window.location.href = "app://ban_user";
            return;
        }

        // 3. فحص حظر الكود النشط حالياً (للفحص الخلفي الفوري)
        if (activeCode && activeCode !== "") {
            // إذا كان الكود يبدأ بـ MASTER نتجاهل الفحص لأن الإدارة تستخدمه
            if (!activeCode.startsWith("MASTER-")) {
                const liveCodeData = subscriptionCodes[activeCode];
                // إذا الكود أصبح محظور (2) أو تم حذفه من السكربت نهائياً
                if (!liveCodeData || liveCodeData.status === 2) {
                    window.location.href = "app://ban_user";
                    return;
                }
            }
        }

        // 4. تسجيل الدخول التلقائي لأجهزة الـ VIP (إذا لم يكن فحص خلفي)
        if (!isBackground && vipData && vipData.status === 1) {
            const expiry = new Date(vipData.expireAt).getTime();
            if (expiry > Date.now()) {
                document.getElementById('authUI').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                document.getElementById('statusText').innerText = "تم التعرف على جهازك (VIP)...";
                setTimeout(() => {
                    window.location.href = `app://success_auth?code=VIP_AUTO&expiry_time=${expiry}&device_id=${deviceId}`;
                }, 1500);
            }
        }
    }

    // ==========================================
    // دالة تفعيل الكود يدوياً من المستخدم
    // ==========================================
    function login() {
        const code = document.getElementById('subCode').value.trim();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        if (globalDeviceId === "UNKNOWN") {
            showError("جاري الاتصال بالسيرفر، يرجى الانتظار...");
            return;
        }

        const codeData = subscriptionCodes[code];
        if (!codeData) {
            showError("الكود غير صحيح أو غير متوفر!");
            return;
        }

        if (codeData.status === 2) {
            showError("⛔ هذا الكود محظور من الإدارة!");
            setTimeout(() => { window.location.href = "app://ban_user"; }, 1500);
            return;
        }

        // ميزة الكود العابر للبصمة (Master Code)
        let isMasterCode = code.startsWith("MASTER-");
        
        const lockKey = "OWNER_" + code;
        const prevOwner = localStorage.getItem(lockKey);

        if (!isMasterCode && prevOwner && prevOwner !== globalDeviceId) {
            showError("⛔ هذا الكود مستخدم في هاتف آخر مسبقاً!");
            return;
        }

        // حفظ ملكية الكود
        if (!isMasterCode) {
            localStorage.setItem(lockKey, globalDeviceId);
        }

        const expiryMs = getDurationMs(codeData.duration);
        const finalExpiry = Date.now() + expiryMs;

        document.getElementById('authUI').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').innerText = "جاري تفعيل الاشتراك...";

        setTimeout(() => {
            window.location.href = `app://success_auth?code=${code}&expiry_time=${finalExpiry}&device_id=${globalDeviceId}&is_master=${isMasterCode}`;
        }, 1000);
    }

    async function pasteCode() {
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('subCode').value = text.trim();
            } else {
                alert("الصق الكود يدوياً لعدم وجود صلاحية.");
            }
        } catch (e) { alert("فشل اللصق"); }
    }
</script>
</body>
