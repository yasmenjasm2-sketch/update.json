<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفعيل نظام HAMZA VIP</title>
    <style>
        :root {
            --primary: #6C63FF;
            --primary-dark: #5a52d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none; 
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 { margin-bottom: 0.5rem; color: var(--primary); font-weight: 800; letter-spacing: 1px;}
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .input-group { position: relative; margin-bottom: 1.5rem; }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: #0f172a;
            color: var(--primary);
            text-align: center;
            font-size: 1.1rem;
            font-family: monospace;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.2); }

        .btn-main {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
        }

        .btn-main:active { transform: scale(0.96); }

        .btn-paste {
            margin-top: 12px;
            background: rgba(108, 99, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-paste:active { background: var(--primary); color: white;}

        #error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            font-weight: bold;
        }

        .device-id {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-all;
            font-family: monospace;
            opacity: 0.6;
        }

        .spinner {
            width: 30px; height: 30px; border: 3px solid rgba(108, 99, 255, 0.3);
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 10px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(3600deg); } }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>HAMZA VIP</h2>
    <p id="statusText">أدخل كود الاشتراك الآمن للبدء</p>

    <div id="authUI">
        <div class="input-group">
            <input type="text" id="subCode" placeholder="أدخل الكود هنا..." autocomplete="off">
            <button class="btn-paste" onclick="pasteFromClipboard()">لصق الكود</button>
        </div>
        <button class="btn-main" id="activateBtn" onclick="validateLogin()">تفعيل الآن</button>
    </div>
    
    <div class="spinner" id="loader"></div>
    <div id="error-msg"></div>

    <div class="device-id">
        DEVICE ID: <span id="display-id">جاري استخراج البصمة...</span>
    </div>
</div>

<script>
    // --- [ إعدادات النظام والتحديثات ] ---
    // لتفعيل تحديث إجباري، قم بتغيير هذا الرقم هنا وفي تطبيق الأندرويد سيتطلب التحديث
    const REQUIRED_APP_VERSION = "1.0"; 
    const UPDATE_LINK = "https://yasmenjasm2-sketch.github.io/update.json"; // رابط التحديث

    // قراءة البارامترات (في حال كان الفحص في الخلفية)
    const urlParams = new URLSearchParams(window.location.search);
    const isBgCheck = urlParams.get('bg_check') === 'true';

    let deviceId = "UNKNOWN_DEVICE";

    // --- [ قـسـم الـبـصـمـات الـمـوثـوقـة VIP والمحظورة ] ---
    // status: 1 = مفعل ، status: 2 = محظور
    const vipDevices = {
        "b2c8cdd53aba1104": { status: 2, expireAt: "2027-01-01" }, 
        "BANNED_DEVICE_ID_HERE": { status: 2, expireAt: "2026-12-30" }
    };

    // --- [ قـسـم الأكـواد (أشهر، أيام، ساعات) ] ---
    const subscriptionCodes = {
        "HAMZA-MONTH": { status: 1, duration: "30days" },
        "HAMZA-DAY": { status: 1, duration: "1day" },
        "HAMZA-HOUR": { status: 1, duration: "1hour" },
        "HAMZA-TEST": { status: 1, duration: "2hours" },
        "BANNED-CODE": { status: 2, duration: "0days" } // كود محظور
    };

    // دالة تحويل المدة إلى أجزاء من الثانية (نظام الساعات والأيام)
    function getDurationMs(durationStr) {
        let ms = 0;
        let match = durationStr.match(/(\d+)/); 
        let val = match ? parseInt(match[0]) : 0;
        
        if (durationStr.includes("day")) ms = val * 24 * 60 * 60 * 1000;
        else if (durationStr.includes("hour")) ms = val * 60 * 60 * 1000;
        return ms;
    }

    // استقبال البيانات من الأندرويد (تتضمن البصمة والإصدار)
    function setDeviceData(id, appVersion) {
        deviceId = id;
        
        // 1. نظام إرسال التحديث
        if (appVersion !== REQUIRED_APP_VERSION) {
            window.location.href = `app://check_update?link=${encodeURIComponent(UPDATE_LINK)}`;
            return;
        }

        if (!isBgCheck) {
            document.getElementById('display-id').innerText = deviceId;
        }

        // 2. نظام فحص البصمة التلقائي (VIP / محظور)
        checkVipStatus(id); 
    }

    function checkVipStatus(id) {
        if (vipDevices[id]) {
            const data = vipDevices[id];
            
            // فحص الحظر
            if (data.status === 2) {
                window.location.href = "app://ban_user";
                return;
            }

            const expiry = new Date(data.expireAt).getTime();
            if (expiry > Date.now()) {
                if (!isBgCheck) showLoading("تم التعرف على جهازك (VIP)... جاري الدخول");
                setTimeout(() => {
                    window.location.href = `app://success_auth?code=VIP_AUTO&expiry_time=${expiry}&device_id=${id}&silent=${isBgCheck}`;
                }, isBgCheck ? 0 : 1500);
            }
        }
    }

    function validateLogin() {
        const code = document.getElementById('subCode').value.trim();
        if (deviceId === "UNKNOWN_DEVICE") {
            showError("انتظر جلب بصمة الجهاز...");
            return;
        }

        const data = subscriptionCodes[code];
        if (!data) {
            showError("الكود غير صحيح!");
            return;
        }

        // نظام الحظر للأكواد
        if (data.status === 2) {
            showError("⛔ تم حظر هذا الكود من الإدارة!");
            setTimeout(() => { window.location.href = "app://ban_user"; }, 1500);
            return;
        }

        let savedOwner = localStorage.getItem("OWNER_" + code);
        if (savedOwner && savedOwner !== deviceId) {
            showError("⛔ الكود مرتبط بجهاز آخر (نظام الحصر)!");
            return;
        }

        showLoading("جاري تفعيل الحساب...");
        localStorage.setItem("OWNER_" + code, deviceId);
        
        // حساب الوقت بناءً على الكود (أيام أو ساعات)
        const expiry = Date.now() + getDurationMs(data.duration);
        
        setTimeout(() => {
            window.location.href = `app://success_auth?code=${code}&expiry_time=${expiry}&device_id=${deviceId}&silent=false`;
        }, 1000);
    }

    function showLoading(msg) {
        document.getElementById('authUI').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').innerText = msg;
        document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
    }

    function pasteFromClipboard() {
        navigator.clipboard.readText().then(text => {
            document.getElementById('subCode').value = text.trim();
        }).catch(() => alert("اكتب الكود يدوياً لعدم وجود صلاحية."));
    }
</script>
</body>
</html>
