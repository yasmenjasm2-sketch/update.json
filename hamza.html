<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0F051D">
    <title>تفعيل HAMZA VIP | نظام محمي متطور</title>
    <style>
        :root {
            --bg-color: #0F051D;
            --card-bg: rgba(45, 27, 77, 0.85);
            --primary: #9D4EDD;
            --primary-dark: #6A0DAD;
            --text-main: #FFFFFF;
            --text-muted: #E0AAFF;
            --input-bg: #1E0B36;
            --border-color: #4A306D;
            --error: #ff4757;
            --neon-glow: 0 0 20px rgba(157, 78, 221, 0.6);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
            justify-content: center;
        }

        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 24px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--neon-glow);
            width: 85%;
            max-width: 340px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .app-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 22px;
            margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(157, 78, 221, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }

        h2 { 
            margin: 0 0 8px 0; 
            font-size: 24px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            background: linear-gradient(to left, #FFFFFF, #E0AAFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 30px 0; font-weight: 500; }

        .input-wrapper { position: relative; margin-bottom: 24px; width: 100%; }
        input {
            width: 100%;
            padding: 16px 85px 16px 16px;
            border-radius: 18px;
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            color: #FFFFFF;
            box-sizing: border-box;
            text-align: center;
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus { 
            border-color: var(--primary); 
            background: #2A1744; 
            outline: none;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }

        .paste-btn {
            position: absolute; left: 8px; top: 50%;
            transform: translateY(-50%);
            background: rgba(157, 78, 221, 0.25);
            color: #E0AAFF;
            border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 14px;
            font-size: 12.5px; cursor: pointer; font-weight: 700;
            transition: all 0.2s ease;
        }
        .paste-btn:active { background: var(--primary); color: white; transform: translateY(-50%) scale(0.95); }

        button.main-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 18px; color: white;
            font-weight: 700; font-size: 16px; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(157, 78, 221, 0.4);
        }
        button.main-btn:active { transform: scale(0.97); filter: brightness(1.2); }

        /* إضافة تنسيقات زر ورقم الواتساب الاحترافية */
        .whatsapp-section { 
            display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 5px; 
        }
        .wa-btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 14px; border-radius: 16px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
            transition: all 0.2s ease; box-sizing: border-box;
        }
        .wa-btn:active { transform: scale(0.96); filter: brightness(1.1); }
        .wa-number-container {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(37, 211, 102, 0.1); border: 1.5px solid rgba(37, 211, 102, 0.3);
            padding: 12px 16px; border-radius: 16px; cursor: pointer;
            transition: all 0.2s ease; box-sizing: border-box;
        }
        .wa-number-container:active { transform: scale(0.96); background: rgba(37, 211, 102, 0.2); }
        .wa-number { color: #FFFFFF; font-family: monospace; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
        .copy-hint { font-size: 12.5px; color: #25D366; font-weight: 700; transition: all 0.3s ease; }

        #error { color: var(--error); font-size: 13px; margin-top: 16px; display: none;
            padding: 12px; border-radius: 14px; background: rgba(255, 71, 87, 0.15); font-weight: 600;
            border: 1px solid rgba(255, 71, 87, 0.3); animation: shake 0.4s ease; }
            
        .device-info { font-size: 12px; color: var(--text-muted); margin-top: 24px; font-family: monospace; opacity: 0.6; letter-spacing: 0.5px;}

        .loader {
            display: none; width: 32px; height: 32px;
            border: 3.5px solid rgba(157, 78, 221, 0.2);
            border-radius: 50%; border-top-color: var(--primary);
            animation: spin 0.8s linear infinite; margin: 15px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { from { transform: scale(1); box-shadow: 0 10px 25px rgba(157, 78, 221, 0.4); } to { transform: scale(1.03); box-shadow: 0 10px 30px rgba(157, 78, 221, 0.7); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>

<div class="app-container" id="mainCard">
    <div class="app-icon">🛡️</div>
    <h2>᷂نـبـࢪاس اݪ᷂ـديـࢪي¹⁶⚚</h2>
    <p class="subtitle" id="statusText">أدخل كود الاشتراك الآمن لتأكيد الهوية</p>
    
    <div id="authUI">
        <div class="input-wrapper">
            <input type="text" id="subCode" placeholder="•••• •••• ••••" autocomplete="off" spellcheck="false">
            <button class="paste-btn" onclick="pasteCode()">لصق</button>
        </div>

        <button class="main-btn" onclick="login()">تفعيل النظام الآن</button>

        <!-- قسم الدعم الفني الجديد لواتساب -->
        <div class="whatsapp-section">
            <a href="https://wa.me/905424678123" target="_blank" class="wa-btn">
                الدعم الفني عبر واتساب 💬
            </a>
            <div class="wa-number-container" onclick="copyWaNumber()">
                <span class="wa-number" dir="ltr">+90 542 467 81 23</span>
                <span class="copy-hint" id="copyHint">انسخ الرقم 📋</span>
            </div>
        </div>
    </div>

    <div class="loader" id="loader"></div>
    <div id="error" class="error"></div>
    <div class="device-info" id="deviceDisplay">جاري الاتصال بالسيرفر الداخلي...</div>
</div>

<script>
    const REQUIRED_APP_VERSION = "2.1.0";
    const UPDATE_LINK = "https://yasmenjasm2-sketch.github.io/update.json";

    // تم فك تشفير مصفوفة الأجهزة وإلغاء الـ Base64 لسهولة تعديلها مباشرة بدون أخطاء
    const secureVipDevices = {
        "b2c8cdd53aba1104": { s: 1, e: "2027-01-01T00:00:00" }, 
        "6357ef9846e96b17": { s: 1, e: "2026-06-06T04:04:46" }
    };

    // تم فك تشفير الأكواد المقبولة لتصبح واضحة بالكامل
    const secureSubscriptionCodes = {
        "HAMZA-MONTH": { d: "30days", s: 1 },    
        "HAMZA-DAY":   { d: "1day", s: 1 },       
        "HAMZA-HOUR":  { d: "1hour", s: 1 },      
        "HAMZA-TEST":  { d: "5minutes", s: 1 },  
        "BANNED-CODE": { d: "30days", s: 2 }     
    };

    let globalDeviceId = "UNKNOWN";

    function getDurationMs(durationStr) {
        let ms = 0;
        const match = durationStr.match(/(\d+)/);
        const val = match ? parseInt(match[0]) : 0;
        if (durationStr.includes("day")) ms = val * 24 * 60 * 60 * 1000;
        else if (durationStr.includes("hour")) ms = val * 60 * 60 * 1000;
        else if (durationStr.includes("minute")) ms = val * 60 * 1000;
        return ms;
    }

    function showError(msg) {
        const err = document.getElementById('error');
        err.innerText = msg;
        err.style.display = 'block';
    }

    function verifySession(deviceId, appVersion, activeCode, isBackground) {
        globalDeviceId = deviceId;
        
        if (!isBackground) {
            document.getElementById('deviceDisplay').innerText = "DEVICE ID: " + deviceId;
        }

        if (appVersion !== REQUIRED_APP_VERSION) {
            window.location.href = `app://force_update?link=${encodeURIComponent(UPDATE_LINK)}`;
            return;
        }

        // توافق تام: إذا كان الاتصال قادم من حساب إداري (Master) يتم تجاوز الفحص تماماً لتفادي البلوك العشوائي
        if (deviceId === "MASTER_BYPASS") {
            if (!isBackground) {
                document.getElementById('authUI').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                document.getElementById('statusText').innerText = "مرحباً بك يا مطور، تم تفعيل وضع التخطي الكامل 👑";
                setTimeout(() => {
                    window.location.href = `app://success_auth?code=MASTER_BYPASS&expiry_time=${Date.now() + 31536000000}&device_id=MASTER_BYPASS&is_master=true`;
                }, 1200);
            }
            return;
        }

        // فحص البصمة المفتوحة مباشرة بدون تشفير المعرّف
        const vipData = secureVipDevices[deviceId];
        if (vipData && vipData.s === 2) {
            window.location.href = "app://ban_user";
            return;
        }

        if (activeCode && activeCode !== "") {
            if (!activeCode.startsWith("MASTER-") && activeCode !== "MASTER_BYPASS") {
                const liveCodeData = secureSubscriptionCodes[activeCode];
                if (liveCodeData && liveCodeData.s === 2) {
                    window.location.href = "app://ban_user";
                    return;
                }
            }
        }

        if (!isBackground && vipData && vipData.s === 1) {
            const expiry = new Date(vipData.e).getTime();
            if (expiry > Date.now()) {
                document.getElementById('authUI').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                document.getElementById('statusText').innerText = "مرحباً بك، تم التعرف على بصمة الـ VIP ✨";
                setTimeout(() => {
                    window.location.href = `app://success_auth?code=VIP_AUTO&expiry_time=${expiry}&device_id=${deviceId}`;
                }, 1200);
            }
        }
    }

    function login() {
        const code = document.getElementById('subCode').value.trim();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        if (globalDeviceId === "UNKNOWN") {
            showError("⏳ جاري تهيئة الاتصال المشفر بالهاتف، انتظر ثانية...");
            return;
        }

        if (!code) {
            showError("⚠️ حقل الإدخال فارغ! يرجى كتابة كود صالح.");
            return;
        }

        let isMasterCode = code.startsWith("MASTER-") || code === "MASTER_BYPASS";
        let codeData = secureSubscriptionCodes[code];
        
        // دعم ديناميكي وتوافق كامل للأكواد الإدارية التي تبدأ بـ MASTER- لمنع تعليق النظام
        if (isMasterCode && !codeData) {
            codeData = { d: "365days", s: 1 };
        }
        
        if (!codeData) {
            showError("❌ الكود المرفق غير صحيح أو منتهي الصلاحية!");
            return;
        }

        if (codeData.s === 2) {
            showError("⛔ هذا الكود محظور نهائياً من قبل الإدارة!");
            setTimeout(() => { window.location.href = "app://ban_user"; }, 1200);
            return;
        }

        const lockKey = "OWNER_" + code;
        const prevOwner = localStorage.getItem(lockKey);

        if (!isMasterCode && prevOwner && prevOwner !== globalDeviceId && globalDeviceId !== "MASTER_BYPASS") {
            showError("⛔ عذراً، هذا الكود مفعل وجاري استخدامه بجهاز آخر!");
            return;
        }

        if (!isMasterCode && globalDeviceId !== "MASTER_BYPASS") {
            localStorage.setItem(lockKey, globalDeviceId);
        }

        const expiryMs = getDurationMs(codeData.d);
        const finalExpiry = Date.now() + expiryMs;

        document.getElementById('authUI').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').innerText = "جاري فحص وتأمين الترخيص الفوري...";

        setTimeout(() => {
            window.location.href = `app://success_auth?code=${encodeURIComponent(code)}&expiry_time=${finalExpiry}&device_id=${globalDeviceId}&is_master=${isMasterCode}`;
        }, 1200);
    }

    async function pasteCode() {
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('subCode').value = text.trim();
            } else {
                alert("يرجى لصق الكود يدوياً لعدم اكتمال صلاحيات متصفح النظام الداخلي.");
            }
        } catch (e) { alert("فشلت عملية اللصق التلقائي."); }
    }

    // دالة نسخ رقم الواتساب بضغطة زر
    function copyWaNumber() {
        const number = "+905424678123";
        navigator.clipboard.writeText(number).then(() => {
            const hint = document.getElementById('copyHint');
            hint.innerText = "تم النسخ! ✔️";
            hint.style.color = "#FFFFFF";
            setTimeout(() => { 
                hint.innerText = "انسخ الرقم 📋"; 
                hint.style.color = "#25D366";
            }, 2000);
        }).catch(() => {
            alert("فشل النسخ التلقائي، يرجى نسخ الرقم يدوياً: " + number);
        });
    }
</script>
</body>
</html>
