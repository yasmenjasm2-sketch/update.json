<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FawakihAI Assistant - Web Ver 3.4.0</title>
    <style>
        /* إعدادات الخطوط والصفحة العامة المستوحاة من أندرويد */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            height: 100%;
            background: linear-gradient(to bottom, #0F172A, #020617);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. الترويسة (Header) */
        .header-title {
            background: linear-gradient(to right, #3B82F6, #1D4ED8);
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        /* 2. شريط اختيار النموذج (Model Selector) */
        .model-selector-container {
            margin: 15px 20px 5px 20px;
            padding: 10px 15px;
            background-color: #1E293B;
            border-radius: 15px;
            border: 3px solid #8B5CF6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-label {
            color: #C4B5FD;
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
        }

        .model-spinner {
            background-color: transparent;
            color: #FFFFFF;
            border: none;
            outline: none;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
        }

        .model-spinner option {
            background-color: #1E293B;
            color: #FFFFFF;
        }

        /* 3. منطقة المحادثة (Chat Container) */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* إخفاء شريط التمرير الافتراضي لتصميم أنيق كالأندرويد */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 10px;
        }

        /* تصميم فقاعات الرسائل */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #8B5CF6;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* بديل نصي للأفاتار في حال عدم وجود صورة حمزة */
        .avatar-fallback {
            width: 100%;
            height: 100%;
            background-color: #8B5CF6;
        }

        .message-text {
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.6;
            word-break: break-word;
        }

        .user .message-text {
            background-color: #3B0764;
            border: 2px solid #6B21A8;
            border-radius: 18px 18px 0px 18px;
        }

        .ai .message-text {
            background-color: #1E293B;
            border: 2px solid #334155;
            border-radius: 0px 18px 18px 18px;
        }

        /* مؤشر جاري التفكير */
        .typing-indicator {
            color: #94A3B8;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            align-self: flex-start;
        }

        /* 4. منطقة الإدخال السفلى (Input Bar) */
        .input-layout {
            background-color: #0F172A;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .input-message {
            flex: 1;
            background-color: #1E293B;
            border: 2px solid #334155;
            border-radius: 25px;
            color: #FFFFFF;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-message::placeholder {
            color: #64748B;
        }

        .input-message:focus {
            border-color: #8B5CF6;
        }

        .btn-send {
            background: linear-gradient(135deg, #A855F7, #7E22CE);
            color: #FFFFFF;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 10px rgba(126, 34, 206, 0.3);
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header-title">FawakihAI Assistant - Ver 3.4.0</div>

    <div class="model-selector-container">
        <span class="model-label">النموذج:</span>
        <select class="model-spinner" id="modelSpinner">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-4">Gemini 4</option>
            <option value="gemini-pro-vision">Gemini Pro Vision</option>
        </select>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-layout">
        <input type="text" class="input-message" id="inputMessage" placeholder="اكتب سؤالك أو أمرك البرمجي هنا..." autocomplete="off">
        <button class="btn-send" id="btnSend">إرسال</button>
    </div>

    <script>
        // مصفوفة المفاتيح الذكية الخمسة المتطابقة تماماً مع كود التطبيق المصدري
        const API_KEYS = [
            "AQ.Ab8RN6JxmgxYX01uu0yvdgmNAbrcfV1HfoCHSstL2hE81DLlHQ", 
            "AIzaSyCT1MAYjQ0lwQ3rHDGbv1d84xDSN6Mule8",               
            "AIzaSyCUXFceC7VvhDThTCkoWuzNTjPuBvxutWI",
            "AQ.Ab8RN6IKeY-SJILFDNiDLptc3JY06jb7QhdrVjVR4XFUlnohrw", 
            "AQ.Ab8RN6Kpr_N5cUb6l0AjIRxeaXgYAQM2Hk3LRlAB2fF67z-CGg"  
        ];

        let currentKeyIndex = 0;
        let typingInterval = null;

        const chatContainer = document.getElementById('chatContainer');
        const inputMessage = document.getElementById('inputMessage');
        const btnSend = document.getElementById('btnSend');
        const modelSpinner = document.getElementById('modelSpinner');

        // عند تحميل الصفحة، تظهر الرسالة الترحيبية التلقائية
        window.onload = () => {
            addMessageToUI("أهلاً بك! قمت ببرمجة النظام ليسحب النماذج المتوافقة مع مفتاحك تلقائياً من خوادم Google. اختر النموذج من القائمة العلوية وكيف يمكنني مساعدتك اليوم؟", false);
        };

        // تصفير العداد للبدء بفحص المفاتيح من الأول عند تبديل النموذج الوهمي
        modelSpinner.addEventListener('change', () => {
            currentKeyIndex = 0;
        });

        // تنفيذ الإرسال عند النقر على الزر
        btnSend.addEventListener('click', handleSend);

        // تنفيذ الإرسال عند الضغط على زر Enter داخل حقل الإدخال
        inputMessage.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        function handleSend() {
            const msg = inputMessage.value.trim();
            if (msg !== "") {
                addMessageToUI(msg, true);
                inputMessage.value = "";
                
                // إعادة تصفير العداد للبدء بالتحقق التلقائي من أول مفتاح مع كل رسالة جديدة
                currentKeyIndex = 0;
                sendToGeminiAI(msg);
            }
        }

        // إضافة الرسائل والفقاعات البصرية إلى واجهة الويب
        function addMessageToUI(message, isUser) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', isUser ? 'user' : 'ai');

            if (!isUser) {
                // الأفاتار الخاص بالذكاء الاصطناعي (يبحث عن ملف الصورة hamza.jpg أو يعود للخلفية التلقائية)
                const avatarDiv = document.createElement('div');
                avatarDiv.classList.add('avatar');
                
                const img = document.createElement('img');
                img.src = 'hamza.jpg'; 
                img.onerror = () => {
                    img.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.classList.add('avatar-fallback');
                    avatarDiv.appendChild(fallback);
                };
                avatarDiv.appendChild(img);
                messageRow.appendChild(avatarDiv);
            }

            const textDiv = document.createElement('div');
            textDiv.classList.add('message-text');
            textDiv.innerText = message;

            messageRow.appendChild(textDiv);
            chatContainer.appendChild(messageRow);
            scrollToBottom();
        }

        // إظهار مؤشر حركة نقاط التفكير (جاري التفكير...)
        function showTypingIndicator() {
            if (document.getElementById('typingIndicator')) return;

            const indicatorRow = document.createElement('div');
            indicatorRow.classList.add('message-row', 'ai', 'typing-indicator');
            indicatorRow.id = 'typingIndicator';

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('avatar');
            const img = document.createElement('img');
            img.src = 'hamza.jpg';
            img.onerror = () => { img.style.display = 'none'; const fb = document.createElement('div'); fb.classList.add('avatar-fallback'); avatarDiv.appendChild(fb); };
            avatarDiv.appendChild(img);
            indicatorRow.appendChild(avatarDiv);

            const textSpan = document.createElement('span');
            textSpan.id = 'typingText';
            textSpan.innerText = "جاري التفكير";
            indicatorRow.appendChild(textSpan);

            chatContainer.appendChild(indicatorRow);
            scrollToBottom();

            let dotCount = 0;
            typingInterval = setInterval(() => {
                dotCount++;
                if (dotCount > 3) dotCount = 0;
                let dots = "جاري التفكير";
                for (let i = 0; i < dotCount; i++) dots += ".";
                textSpan.innerText = dots;
            }, 400);
        }

        // إزالة مؤشر التفكير عند استلام الرد
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                clearInterval(typingInterval);
                indicator.remove();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // دالة الاتصال بخوادم الـ API ومعالجة التبديل الذاتي الصامت بالخلفية
        async function sendToGeminiAI(userMessage) {
            btnSend.disabled = true;
            btnSend.innerText = "...";
            showTypingIndicator();

            const activeApiKey = API_KEYS[currentKeyIndex];
            // يعتمد الويب دائماً على خادم معالجة نموذج gemini-2.5-flash في الخلفية للأداء السريع والمطابق للتطبيق
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeApiKey}`;

            const requestBody = {
                system_instruction: {
                    parts: {
                        text: "أنت مساعد ذكي مدمج في تطبيق FawakihAI (الإصدار 3.4.0). تم تطوير هذا التطبيق المعقد من قِبل Hamza Al-Hammada. وظيفتك مساعدة المستخدمين والإجابة على استفساراتهم باحترافية وسرعة."
                    }
                },
                contents: [
                    {
                        parts: [
                            { text: userMessage }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (response.status === 200) {
                    const data = await response.json();
                    const aiReply = data.candidates[0].content.parts[0].text;
                    showResponse(aiReply);
                } else {
                    // في حال كان كود الاستجابة ليس 200 (نفاذ الحصة أو خطأ بالمفتاح)، نفحص المفتاح التالي تلقائياً
                    handleKeyFallback(userMessage);
                }
            } catch (error) {
                // في حال انقطاع الشبكة أو حدوث استثناء برمي، نمر للمفتاح التالي بالخلفية فوراً
                handleKeyFallback(userMessage);
            }
        }

        // دالة التنقل وإعادة التوجيه الأوتوماتيكي عبر المفاتيح الخمسة
        function handleKeyFallback(userMessage) {
            if (currentKeyIndex < API_KEYS.length - 1) {
                currentKeyIndex++;
                sendToGeminiAI(userMessage);
            } else {
                // عند استهلاك كافة المفاتيح تماماً، يتم إظهار نصك المخصص المعين
                showResponse("فترتك انتهت فترة المحادثه قم بتبديل نموذج");
            }
        }

        function showResponse(response) {
            removeTypingIndicator();
            addMessageToUI(response, false);
            btnSend.disabled = false;
            btnSend.innerText = "إرسال";
        }
    </script>
</body>
</html>
